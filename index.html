<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Thermos Lid Dashboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; margin: 20px auto; max-width: 400px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 10px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h1>Smart Thermos & Pill Box</h1>
    
    <div class="card">
        <h3>การเชื่อมต่อบลูทูธ (BLE)</h3>
        <button id="connectBtn">เชื่อมต่อกับ ESP32-C3</button>
        <p id="status">สถานะ: ยังไม่ได้เชื่อมต่อ</p>
    </div>

    <div class="card">
        <h3>ซิงค์เวลาปัจจุบัน</h3>
        <button id="syncTimeBtn" disabled>ซิงค์เวลาเข้าบอร์ด</button>
    </div>

    <script>
        const SERVICE_UUID = "42a70001-e29f-412f-a2e6-7b5c87c0e001";
        const TIME_SYNC_CHAR_UUID = "42a70002-e29f-412f-a2e6-7b5c87c0e001";

        let bluetoothDevice;
        let timeCharacteristic;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "กำลังค้นหาอุปกรณ์...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Smart-Thermos-Lid' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                timeCharacteristic = await service.getCharacteristic(TIME_SYNC_CHAR_UUID);

                document.getElementById('status').innerText = "เชื่อมต่อสำเร็จ!";
                document.getElementById('status').style.color = "green";
                document.getElementById('syncTimeBtn').disabled = false;
                
                // ซิงค์เวลาอัตโนมัติทันทีที่เชื่อมต่อ
                syncCurrentTime();

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "การเชื่อมต่อล้มเหลว: " + error;
                document.getElementById('status').style.color = "red";
            }
        });

        async function syncCurrentTime() {
            if (!timeCharacteristic) return;
            try {
                // ดึง Unix Timestamp ปัจจุบัน (หน่วยวินาที)
                const unixTime = Math.floor(Date.now() / 1000);
                
                // แปลงเป็น Uint32Array (4 bytes) ตามที่โค้ด ESP32 คาดหวัง
                const buffer = new ArrayBuffer(4);
                const view = new DataView(buffer);
                view.setUint32(0, unixTime, true); // true = Little Endian

                await timeCharacteristic.writeValue(buffer);
                alert("ซิงค์เวลาเรียบร้อยแล้ว!");
            } catch (error) {
                console.error(error);
                alert("ซิงค์เวลาไม่สำเร็จ: " + error);
            }
        }

        document.getElementById('syncTimeBtn').addEventListener('click', syncCurrentTime);
    </script>

</body>
</html>
