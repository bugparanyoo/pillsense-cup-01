<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Thermos & Pill Box Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 6px 0;
        }

        header p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            text-align: center;
        }

        /* --- กราฟิกแก้วน้ำ --- */
        .water-section {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 14px;
        }

        .water-glass {
            width: 60px;
            height: 100px;
            border: 4px solid var(--primary);
            border-top: none;
            border-radius: 0 0 16px 16px;
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }

        .water-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #3b82f6, #60a5fa);
            height: 0%;
            transition: height 0.4s ease-in-out;
        }

        .water-info {
            text-align: left;
        }

        .water-info .label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .water-info .value {
            font-size: 26px;
            font-weight: 600;
            color: var(--primary);
        }

        /* --- สถานะ 3 ช่องยา --- */
        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slot-row {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .slot-name {
            font-weight: 500;
            color: var(--text-main);
        }

        .slot-status {
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-normal {
            background: #dcfce7;
            color: #166534;
        }

        .status-alert {
            background: #fee2e2;
            color: #991b1b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="time"] {
            padding: 8px 12px;
            font-size: 15px;
            font-family: 'Prompt', sans-serif;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="time"]:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Smart Thermos & Pill Box</h1>
            <p>ระบบควบคุมและติดตามการทานยาอัจฉริยะ</p>
        </header>
        
        <!-- การเชื่อมต่อ BLE -->
        <div class="card">
            <h3>🔗 การเชื่อมต่อบลูทูธ</h3>
            <button id="connectBtn">เชื่อมต่อกับอุปกรณ์</button>
            <div id="status">สถานะ: ยังไม่ได้เชื่อมต่อ</div>
        </div>

        <!-- กราฟิกแก้วน้ำและระดับน้ำ -->
        <div class="card">
            <h3>💧 ระดับน้ำในกระติก</h3>
            <div class="water-section">
                <div class="water-glass">
                    <div class="water-fill" id="waterFill"></div>
                </div>
                <div class="water-info">
                    <div class="label">ปริมาณปัจจุบัน</div>
                    <div class="value" id="waterLevelText">- %</div>
                </div>
            </div>
        </div>

        <!-- สถานะตลับยา 3 ช่องแยกอิสระ -->
        <div class="card">
            <h3>💊 สถานะตลับยาทั้ง 3 มื้อ</h3>
            <div class="slots-container">
                <div class="slot-row">
                    <span class="slot-name">🌅 มื้อเช้า</span>
                    <span class="slot-status status-normal" id="morningStatus">ปกติ</span>
                </div>
                <div class="slot-row">
                    <span class="slot-name">☀️ มื้อกลางวัน</span>
                    <span class="slot-status status-normal" id="noonStatus">ปกติ</span>
                </div>
                <div class="slot-row">
                    <span class="slot-name">🌙 มื้อเย็น</span>
                    <span class="slot-status status-normal" id="eveningStatus">ปกติ</span>
                </div>
            </div>
        </div>

        <!-- ตั้งเวลาแจ้งเตือนมื้อยา -->
        <div class="card">
            <h3>⏰ ตั้งเวลาแจ้งเตือนมื้อยา</h3>
            <div class="input-group">
                <label>🌅 มื้อเช้า</label>
                <input type="time" id="morningTime" value="08:00">
            </div>
            <div class="input-group">
                <label>☀️ มื้อกลางวัน</label>
                <input type="time" id="noonTime" value="12:30">
            </div>
            <div class="input-group">
                <label>🌙 มื้อเย็น</label>
                <input type="time" id="eveningTime" value="19:00">
            </div>
            <button id="setAlarmBtn" disabled style="margin-top: 8px;">บันทึกเวลาแจ้งเตือน</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "42a70001-e29f-412f-a2e6-7b5c87c0e001";
        const TIME_SYNC_CHAR_UUID = "42a70002-e29f-412f-a2e6-7b5c87c0e001";
        const DATA_NOTIFY_CHAR_UUID = "42a70003-e29f-412f-a2e6-7b5c87c0e001";
        const ALARM_SYNC_CHAR_UUID = "42a70004-e29f-412f-a2e6-7b5c87c0e001";

        let bluetoothDevice;
        let bleServer;
        let timeCharacteristic;
        let alarmCharacteristic;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "กำลังค้นหาอุปกรณ์...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Smart-Thermos-Lid' }],
                    optionalServices: [SERVICE_UUID]
                });

                bleServer = await bluetoothDevice.gatt.connect();
                const service = await bleServer.getPrimaryService(SERVICE_UUID);
                
                timeCharacteristic = await service.getCharacteristic(TIME_SYNC_CHAR_UUID);
                alarmCharacteristic = await service.getCharacteristic(ALARM_SYNC_CHAR_UUID);
                
                const dataCharacteristic = await service.getCharacteristic(DATA_NOTIFY_CHAR_UUID);
                await dataCharacteristic.startNotifications();
                dataCharacteristic.addEventListener('characteristicvaluechanged', handleDataChanged);

                document.getElementById('status').innerText = "✅ เชื่อมต่ออุปกรณ์สำเร็จ";
                document.getElementById('status').style.color = "var(--success)";
                document.getElementById('connectBtn').innerText = "เชื่อมต่อแล้ว";
                document.getElementById('connectBtn').style.backgroundColor = "var(--success)";
                document.getElementById('setAlarmBtn').disabled = false;
                
                syncCurrentTime();

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "❌ การเชื่อมต่อล้มเหลว";
                document.getElementById('status').style.color = "#ef4444";
            }
        });

        function handleDataChanged(event) {
            const value = event.target.value;
            const waterPct = value.getUint8(0);
            const slotCode = value.getUint8(1); // 0=ปกติ, 1=เช้า, 2=กลางวัน, 3=เย็น

            // 1. อัปเดตตัวเลขเปอร์เซ็นต์และระดับน้ำในกราฟิกแก้วน้ำ
            document.getElementById('waterLevelText').innerText = waterPct + " %";
            document.getElementById('waterFill').style.height = waterPct + "%";

            // 2. อัปเดตสถานะแยกตาม 3 ช่องยา
            const morningEl = document.getElementById('morningStatus');
            const noonEl = document.getElementById('noonStatus');
            const eveningEl = document.getElementById('eveningStatus');

            // รีเซ็ตเป็นสถานะปกติทั้งหมดก่อน
            morningEl.innerText = "ปกติ"; morningEl.className = "slot-status status-normal";
            noonEl.innerText = "ปกติ"; noonEl.className = "slot-status status-normal";
            eveningEl.innerText = "ปกติ"; eveningEl.className = "slot-status status-normal";

            // เปลี่ยนสถานะเฉพาะช่องที่กำลังแจ้งเตือน
            if (slotCode === 1) {
                morningEl.innerText = "กำลังเตือน ⏰";
                morningEl.className = "slot-status status-alert";
            } else if (slotCode === 2) {
                noonEl.innerText = "กำลังเตือน ⏰";
                noonEl.className = "slot-status status-alert";
            } else if (slotCode === 3) {
                eveningEl.innerText = "กำลังเตือน ⏰";
                eveningEl.className = "slot-status status-alert";
            }
        }

        async function syncCurrentTime() {
            if (!timeCharacteristic) return;
            try {
                const unixTime = Math.floor(Date.now() / 1000);
                const buffer = new ArrayBuffer(4);
                const view = new DataView(buffer);
                view.setUint32(0, unixTime, true);
                await timeCharacteristic.writeValue(buffer);
            } catch (error) {
                console.error("Time sync failed:", error);
            }
        }

        document.getElementById('setAlarmBtn').addEventListener('click', async () => {
            if (!alarmCharacteristic) {
                alert("ยังไม่ได้เชื่อมต่อบลูทูธ!");
                return;
            }

            try {
                const morning = document.getElementById('morningTime').value.split(':');
                const noon = document.getElementById('noonTime').value.split(':');
                const evening = document.getElementById('eveningTime').value.split(':');

                const buffer = new Uint8Array([
                    parseInt(morning[0]), parseInt(morning[1]),
                    parseInt(noon[0]), parseInt(noon[1]),
                    parseInt(evening[0]), parseInt(evening[1])
                ]);

                await alarmCharacteristic.writeValue(buffer);
                alert("บันทึกเวลาแจ้งเตือนไปยังตลับยาเรียบร้อยแล้ว!");
            } catch (error) {
                console.error(error);
                alert("ตั้งเวลาไม่สำเร็จ: " + error);
            }
        });
    </script>

</body>
</html>
    </script>

</body>
</html>
